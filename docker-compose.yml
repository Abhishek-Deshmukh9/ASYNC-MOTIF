services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: motif_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motif}
      POSTGRES_USER: ${POSTGRES_USER:-motif_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motif_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motif_user} -d ${POSTGRES_DB:-motif}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motif_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-motif}
      - POSTGRES_USER=${POSTGRES_USER:-motif_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-motif_password}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-motif_user}:${POSTGRES_PASSWORD:-motif_password}@postgres:5432/${POSTGRES_DB:-motif}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-motif_user}:${POSTGRES_PASSWORD:-motif_password}@postgres:5432/${POSTGRES_DB:-motif}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  triage-ui:
    build:
      context: ./triage-ui
      dockerfile: Dockerfile
    container_name: motif_triage_ui
    restart: unless-stopped
    environment:
      - MOTIF_API_URL=http://backend:8000
    volumes:
      - ./triage-ui:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
